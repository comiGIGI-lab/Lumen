<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="color-scheme" content="light">
<meta name="description" content="智识有方 LUMEN · 单文件版：今天做一件事，明天的方案被你今天的表现改写。">
<title>智识有方 LUMEN · 今天做一件事</title>
<style>
/* 视觉令牌：米底 #FBF9F6 / 强调红 #E51520 / 漫画轻松圆体刊名（仅系统字体，零 CDN）
   字号只准 5 档：12 / 14 / 17 / 24 / 32（字重只准 400 / 500）
   例外：input/textarea/select 保持 16px，防止 iOS 聚焦缩放 —— 不计入产品 UI 字号 */
:root{
  --brand:#E51520; --brand-d:#C4101A; --brand-soft:#FDECEE; --brand-line:#F3C4C7;
  --ink:#191919; --ink2:#3A3A3A; --muted:#9C9DA1; --faint:#9C9DA1;
  --line:#E2E4E7; --line-s:#D4D6D9; --soft:#F8F3EC; --hover:#F3EEE6; --paper:#FBF9F6;
  --s0:#9AA5B1; /* 未学 */
  --s1:#3B82F6; /* 学过未验证 */
  --s2:#10B981; /* 已验证掌握 */
  --s3:#F59E0B; /* 已衰退 */
  --green:#10B981; --green-bg:#ECFDF5;
  --orange:#F59E0B; --orange-bg:#FFFBEB;
  --red:#E51520; --red-bg:#FDECEE;
  --blue:#3B82F6; --blue-bg:#EAF1FE;
  --r:18px; --r-s:8px;
  /* 正文：圆体优先，缺字回落到系统黑体，保证中文可读 */
  --font:"Yuanti SC","STYuanti","YouYuan","Hiragino Maru Gothic ProN","PingFang SC","Microsoft YaHei UI","Segoe UI",system-ui,sans-serif;
  /* 刊名/Hero：漫画轻松圆体；Windows 幼圆、macOS 圆体、英文 Comic Sans / Chalkboard */
  --serif:"YouYuan","Yuanti SC","STYuanti","Hiragino Maru Gothic ProN","Chalkboard SE","Comic Sans MS","KaiTi","STKaiti",cursive;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background-color:var(--paper);color:var(--ink);
  background-image:
    repeating-linear-gradient(0deg, rgba(28,24,20,.028) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(28,24,20,.018) 0 1px, transparent 1px 4px),
    repeating-radial-gradient(circle at 12% 8%, rgba(196,16,26,.035) 0 1px, transparent 1.2px 22px),
    repeating-radial-gradient(circle at 88% 72%, rgba(120,90,50,.03) 0 1px, transparent 1.2px 28px);
  font-family:var(--font);
  font-size:14px;font-weight:400;line-height:1.65;-webkit-text-size-adjust:100%;
  overflow-x:hidden;overflow-wrap:break-word;word-break:break-word;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:14px;color:inherit;cursor:pointer;border:none;background:none;font-weight:400}
/* 输入框 16px 为例外：防 iOS 缩放，不计入产品 UI 五档字号 */
input,textarea,select{font-family:inherit;font-size:16px;color:inherit;font-weight:400}
b,strong{font-weight:500}
h1,h2,h3,p,ul,ol{margin:0}
h1,h2,h3,.t,.today .kp,.logo-title{font-family:var(--serif);font-weight:500}
ul,ol{padding-left:0;list-style:none}
a{color:var(--brand)}
.wrap{max-width:520px;margin:0 auto;padding:20px 22px 108px 14px}
.noscroll{overflow:hidden}

/* ============ 顶栏（发丝线；刊名做成红印，盖在米纸上） ============ */
.topbar{position:sticky;top:0;z-index:50;background:rgba(251,249,246,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.topbar-in{display:flex;align-items:center;gap:8px;padding:8px 14px;max-width:520px;margin:0 auto}
.logo{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.wordmark{font-family:var(--serif);font-size:12px;font-weight:400;letter-spacing:.22em;color:var(--brand);border:1px solid var(--brand);padding:5px 8px 4px 9px;line-height:1;flex:none;transform:rotate(-0.4deg);background:transparent}
.logo-title{font-size:17px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:6px}
.icon-btn{width:44px;height:44px;min-width:44px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:transparent;font-size:17px;color:var(--ink2);border:0}
.icon-btn:active{background:var(--hover)}
.icon-btn[hidden]{display:none}
.mode-pill{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:999px;background:var(--brand-soft);color:var(--brand-d);font-size:12px;font-weight:500;border:1px solid var(--brand-line);white-space:nowrap}
.mode-pill.live{background:var(--orange-bg);color:#B45309;border-color:#FDE68A}

/* 顶部状态条 */
.bar{display:flex;gap:8px;align-items:flex-start;padding:10px 14px;font-size:12px;font-weight:400;line-height:1.5;border-bottom:1px solid var(--line)}
.bar-warn{background:var(--orange-bg);color:#7A5310}
.bar-err{background:var(--red-bg);color:#8A2F2C}
.bar-info{background:var(--soft);color:var(--ink2)}
.bar .x{margin-left:auto;flex:none;width:28px;height:28px;border-radius:var(--r-s);display:flex;align-items:center;justify-content:center;font-size:14px;opacity:.7}
.bar-txt{flex:1;min-width:0}

/* ============ 通用卡片（Notion 白卡铺米底；Stripe 密度靠 padding） ============ */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-top:16px}
.card.pad0{padding:0;overflow:hidden}
.t{font-size:24px;font-weight:500;color:var(--ink);line-height:1.35;letter-spacing:.01em;margin-top:28px;animation:lumen-rise .55s ease both}
.st{font-size:14px;font-weight:400;color:var(--muted);margin-top:10px}
.h2{font-size:17px;font-weight:500;color:var(--ink);margin-top:18px;display:flex;align-items:center;gap:8px}
.h2 .n{font-size:12px;color:var(--muted);font-family:var(--font);font-weight:400}
.sec-title{font-size:12px;font-weight:400;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin:28px 2px 14px}

/* ============ 按钮（原站胶囊） ============ */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;width:100%;border-radius:1000px;background:var(--brand);color:#fff;font-size:14px;font-weight:500;padding:10px 16px}
.btn:active{background:var(--brand-d);transform:translateY(1px)}
.btn[disabled]{background:#E4DED5;color:#A39B92}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:active{background:var(--hover)}
.btn.sub{background:var(--brand-soft);color:var(--brand-d);border:1px solid var(--brand-line);animation:lumen-rise .55s ease .34s both}
.btn.danger{background:#fff;border:1px solid var(--brand-line);color:var(--brand-d)}
.btn.sm{min-height:44px;font-size:14px}
.btn.gap{margin-top:12px}

/* ============ 徽标 ============ */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:400;padding:2px 9px;border-radius:999px;line-height:1.7;white-space:nowrap}
.badge.demo{background:var(--brand-soft);color:var(--brand-d);border:1px solid var(--brand-line)}
.badge.local{background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.badge.warn{background:var(--orange-bg);color:#B45309;border:1px solid #FDE68A}
.badge.ok{background:var(--green-bg);color:#047857;border:1px solid #A7F3D0}
.badge.ai{background:var(--brand-soft);color:var(--brand-d);border:1px solid var(--brand-line)}
.badge-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

/* ============ 四入口：1 主卡片 + 3 弱化文字行（Notion 去彩图标方块） ============ */
.entry{display:flex;align-items:center;gap:12px;width:100%;min-height:72px;padding:16px 18px;border:1px solid var(--line);border-radius:var(--r);background:#fff;text-align:left;margin-top:16px;animation:lumen-rise .55s ease .08s both}
.entry:active{background:var(--hover)}
.entry .ei{display:none}
.entry .etx{flex:1;min-width:0}
.entry .en{font-size:17px;font-weight:500;line-height:1.35;font-family:var(--serif);color:var(--ink)}
.entry .ed{font-size:12px;font-weight:400;color:var(--muted);margin-top:2px}
.entry .ear{color:var(--faint);font-size:17px;flex:none}
.entry-quiet{display:flex;align-items:center;gap:10px;width:100%;padding:14px 4px;border:none;border-bottom:1px solid var(--line);background:transparent;text-align:left;margin:4px 0 0;min-height:52px;animation:lumen-rise .55s ease .16s both}
.entry-quiet + .entry-quiet{animation-delay:.22s}
.entry-quiet + .entry-quiet + .entry-quiet{animation-delay:.28s}
.entry-quiet:last-of-type{border-bottom:none}
.entry-quiet:active{background:var(--hover)}
.entry-quiet .etx{flex:1;min-width:0}
.entry-quiet .en{display:block;font-size:14px;font-weight:400;line-height:1.35;font-family:var(--font);color:var(--ink2)}
.entry-quiet .ed{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:2px}
.entry-quiet .ear{color:var(--faint);font-size:17px;flex:none}

/* ============ 状态色点 ============ */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:400;padding:3px 9px;border-radius:999px;border:1px solid;white-space:nowrap}
.chip i{font-style:normal;font-size:12px}
.c0{color:#6B7785;background:#F2F4F6;border-color:#DDE2E8}
.c1{color:#1D5FD0;background:var(--blue-bg);border-color:#C9DCFB}
.c2{color:#047857;background:var(--green-bg);border-color:#A7F3D0}
.c3{color:#B45309;background:var(--orange-bg);border-color:#FDE68A}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.d0{background:transparent;border:1px solid #7C8894} /* 未学：最浅空心 */
.d1{background:var(--s1);box-shadow:inset 0 0 0 2px #fff}
.d2{background:var(--s2);border-radius:2px} /* 已验证：最深实心 */
.d3{background:var(--s3);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)} /* 衰退：单独橙菱形 */

/* ============ 表单 ============ */
.field{margin-top:14px}
.lab{font-size:12px;font-weight:400;margin-bottom:6px;display:block;color:var(--muted)}
.lab .req{color:var(--s3)}
.inp,textarea.inp{width:100%;min-height:48px;border:1px solid var(--line);border-radius:var(--r-s);padding:12px 14px;background:#fff;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
textarea.inp{min-height:120px;line-height:1.6;resize:vertical}
.inp:focus{border-color:#F08A8F}
select.inp{background:#fff}
.hint{font-size:12px;font-weight:400;color:var(--muted);margin-top:6px;line-height:1.5}
.hint.warn{color:#B45309}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:96px;min-height:44px;border:1px solid var(--line);border-radius:1000px;background:#fff;font-size:14px;font-weight:400;color:var(--ink2)}
.seg button.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-d);font-weight:500}

/* ============ 今日一课：Linear issue / Things 3 干净纸 — 知识点名唯一大字 ============ */
.today{border:1px solid var(--line);border-radius:var(--r);padding:22px 20px;background:#fff;margin-top:16px}
.today .kp{font-size:24px;font-weight:500;color:var(--ink);line-height:1.3}
.today .badge-row,.today .mrow{opacity:.9}
.today-dur{font-size:12px;font-weight:400;color:var(--muted);margin-top:8px;line-height:1.4}
.mrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.mini{font-size:12px;font-weight:400;background:transparent;color:var(--muted);border-radius:999px;padding:3px 9px;border:1px solid var(--line)}
.outbox{margin-top:14px;background:transparent;border-radius:0;padding:12px 0 0;border:none;border-top:1px solid var(--line)}
.outbox .ol{font-size:12px;font-weight:400;color:var(--muted);letter-spacing:.4px}
.outbox .ov{font-size:14px;font-weight:400;color:var(--ink2);margin-top:4px;line-height:1.5}

/* 变更说明 */
.why{margin-top:12px;border-radius:var(--r);border:1px solid var(--line);background:var(--soft);padding:13px 14px}
.why .wt{font-size:12px;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:6px}
.why ul{margin-top:8px}
.why li{font-size:14px;font-weight:400;line-height:1.6;color:var(--ink2);padding-left:16px;position:relative;margin-top:5px}
.why li::before{content:"→";position:absolute;left:0;color:var(--faint);font-weight:400}

/* 三栏：浅底 + 左侧 2px 色条，禁止大饱和色块 */
.col{border-radius:var(--r-s);padding:13px 14px;margin-top:10px;background:var(--soft);border:1px solid var(--line);border-left:2px solid var(--line-s)}
.col.g{background:var(--green-bg);border-left-color:var(--green)}
.col.o{background:var(--orange-bg);border-left-color:var(--orange)}
.col.r{background:var(--brand-soft);border-left-color:var(--brand)}
.col .ch{font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px;color:var(--ink2)}
.col.g .ch{color:#047857}.col.o .ch{color:#B45309}.col.r .ch{color:#8A2F2C}
.col li{font-size:14px;font-weight:400;line-height:1.6;margin-top:8px;position:relative;padding-left:18px;color:var(--ink2)}
.col li::before{content:"·";position:absolute;left:4px;font-weight:400}
.quote{display:block;margin-top:6px;font-size:14px;font-weight:400;color:var(--ink2);background:#fff;border-left:2px solid var(--line-s);border-radius:6px;padding:7px 10px;line-height:1.55}
.quote b{color:#8A5A06;font-weight:500}
.empty{font-size:14px;font-weight:400;color:var(--muted);margin-top:6px}

/* 列表行 */
.row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .rn{flex:1;min-width:0;font-size:14px;font-weight:400;line-height:1.45;color:var(--ink2)}
.row .rs{font-size:12px;color:var(--muted);margin-top:2px;font-weight:400}
.row:active{background:var(--soft)}

/* 知识点地图：GitHub 热力图深浅 + Obsidian 淡节点，避免绿橙色块墙 */
.map{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}
.node{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:#fff;text-align:left;min-height:76px;display:flex;flex-direction:column;gap:6px}
.node:active{background:var(--hover)}
.node .nn{font-size:14px;font-weight:500;line-height:1.35;flex:1;color:var(--ink)}
.node .nc{font-size:12px;font-weight:400;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.node.n0{background:#fff;border-style:dashed;border-color:var(--line)}
.node.n0 .nn{color:var(--muted);font-weight:400}
.node.n1{background:#F7FAFF;border-color:#E2E8F0}
.node.n2{background:#F4F8F6;border-color:#D9E4DE}
.node.n2 .nn{color:var(--ink);font-weight:500}
.node.n3{background:#fff;border-color:var(--line);border-left:2px solid var(--s3)}
.legend{display:flex;flex-wrap:nowrap;gap:12px;margin-top:12px;margin-bottom:8px;font-size:12px;font-weight:400;color:var(--muted);overflow-x:auto}
.legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}

/* 测评 */
.qn{font-size:17px;font-weight:500;line-height:1.55;color:var(--ink)}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;min-height:48px;padding:11px 13px;border:1px solid var(--line);border-radius:var(--r-s);margin-top:9px;background:#fff;font-size:14px;font-weight:400;line-height:1.5}
.opt .ok{font-weight:500;flex:none;width:22px}
.opt.correct{background:var(--green-bg);border-color:#A7F3D0}
.opt.wrong{background:var(--red-bg);border-color:var(--brand-line)}
.opt:disabled{cursor:default}
.exp{margin-top:12px;border-radius:var(--r-s);background:var(--soft);padding:12px 13px;font-size:14px;font-weight:400;line-height:1.6}

/* 执行卡：Things 3 — 计时器只保留数字本身，不加装饰环 */
.timer{font-size:32px;font-weight:500;letter-spacing:1px;text-align:center;font-variant-numeric:tabular-nums;line-height:1.1;font-family:var(--serif);color:var(--ink)}
.timer small{font-size:17px;font-weight:400;color:var(--muted);font-family:var(--font)}
.tbar{height:2px;border-radius:0;background:var(--line);overflow:hidden;margin-top:14px}
.tbar i{display:block;height:100%;background:var(--brand);width:0%}

/* 底部导航（Linear 工具栏更薄） */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(251,249,246,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar-in{display:flex;max-width:520px;margin:0 auto}
.tabbar button{flex:1;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted);font-weight:400}
.tabbar button .ti{font-size:17px;line-height:1}
.tabbar button.on{color:var(--brand);font-weight:500}

/* 弹层 */
.mask{position:fixed;inset:0;z-index:100;background:rgba(25,25,25,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:20px 20px 0 0;max-height:88vh;overflow:auto;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
.sheet h3{font-size:17px;font-weight:500}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:80px;z-index:200;background:#191919;color:#fff;font-size:14px;font-weight:400;padding:11px 16px;border-radius:var(--r);max-width:88vw;line-height:1.5;box-shadow:0 8px 24px rgba(25,25,25,.16)}

/* 折叠 */
.fold{border:1px solid var(--line);border-radius:var(--r);margin-top:12px;overflow:hidden;background:#fff}
.fold>summary{padding:14px;min-height:52px;font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary .fx{margin-left:auto;color:var(--muted);font-size:12px;font-weight:400}
.fold .fb{padding:0 14px 14px}

/* 其它 */
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px;font-weight:400;padding:8px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--muted);flex:none}
.kv .v{text-align:right;font-weight:400;word-break:break-all}
.num{font-size:24px;font-weight:500;color:var(--ink)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;font-weight:400;background:var(--soft);border-radius:var(--r-s);padding:9px 10px;overflow-x:auto;white-space:pre-wrap;word-break:break-all;line-height:1.55}
.center{text-align:center}
.mt{margin-top:12px}
.mt2{margin-top:18px}
.divider{height:1px;background:var(--line);margin:16px 0}
.small{font-size:12px;font-weight:400;color:var(--muted);line-height:1.55}
.b{font-weight:500}
.spread{display:flex;gap:10px}
.spread>*{flex:1}

/* 刊物质感：一条错落入场（只动 opacity + translateY，不改宽高） */
@keyframes lumen-rise{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}
@media (prefers-reduced-motion:reduce){
  .t,.entry,.entry-quiet,.btn.sub{animation:none}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <button class="icon-btn" id="btnBack" hidden aria-label="返回">←</button>
    <div class="logo"><span class="wordmark">LUMEN</span><span class="logo-title">智识有方</span></div>
    <button class="mode-pill" id="btnMode" aria-label="切换模式"><span id="modeDot">●</span><span id="modeTxt">演示模式</span></button>
  </div>
  <div id="bars"></div>
</header>

<main class="wrap" id="view"></main>

<nav class="tabbar">
  <div class="tabbar-in">
    <button data-tab="home"><span class="ti">⌂</span>首屏</button>
    <button data-tab="today"><span class="ti">◎</span>今日一课</button>
    <button data-tab="map"><span class="ti">▦</span>掌握度</button>
    <button data-tab="me"><span class="ti">⚙</span>我的</button>
  </div>
</nav>

<div id="layer"></div>

<script>
"use strict";
/* ==========================================================================
   智识有方 LUMEN · 1024 造物挑战参赛版

function rd(k, def){ try{ var s=localStorage.getItem(k); return s==null?def:JSON.parse(s);}catch(e){return def;} }
function wr(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true;}catch(e){ return false; } }
function rdS(k, def){ try{ var s=sessionStorage.getItem(k); return s==null?def:JSON.parse(s);}catch(e){return def;} }
function wrS(k, v){ try{ sessionStorage.setItem(k, JSON.stringify(v)); return true;}catch(e){return false;} }
function rm(k){ try{ localStorage.removeItem(k);}catch(e){} try{ sessionStorage.removeItem(k);}catch(e){} }

/* ---------------------------------------------------------------- 日期层 */
function pad(n){ return n<10?('0'+n):(''+n); }
function dstr(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function todayDate(){ var d=new Date(); var off=(ui().dayOffset|0); d.setDate(d.getDate()+off); return d; }
function todayKey(){ return dstr(todayDate()); }
function shift(n){ var d=new Date(); d.setDate(d.getDate()+n); return d; }
function daysBetween(a,b){ // a,b: 'YYYY-MM-DD'
  var x=new Date(a+'T00:00:00'), y=new Date(b+'T00:00:00');
  return Math.round((y-x)/86400000);
}
function cnDate(s){ var p=s.split('-'); return parseInt(p[1],10)+'月'+parseInt(p[2],10)+'日'; }
function relDay(s){ var n=daysBetween(s, todayKey()); if(n===0) return '今天'; if(n===1) return '昨天'; if(n===2) return '前天'; if(n<0) return Math.abs(n)+'天后'; return n+'天前'; }

/* ---------------------------------------------------------------- UI 状态 */
function ui(){ return rd(K.ui, {dayOffset:0, hideGuide:false, hideOffline:false}); }
function setUI(patch){ var u=ui(); for(var k in patch) u[k]=patch[k]; wr(K.ui,u); return u; }

/* ---------------------------------------------------------------- 转义 */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }

/* ==========================================================================
   引擎：掌握度推导 → 队列 → 今日方案 → 变更原因
   方案完全由本机状态推导，不调用任何模型。删掉一条记录，队列就会变。
   ========================================================================== */
function courseOf(id){ return COURSES[id]||COURSES.math; }
function pointOf(cid, pid){
  var ps = courseOf(cid).points;
  for(var i=0;i<ps.length;i++) if(ps[i].id===pid) return ps[i];
  return null;
}
function profile(){ return rd(K.profile, null); }
function setProfile(p){ wr(K.profile, p); }
function progress(){ var a=rd(K.progress, null); return Array.isArray(a)?a:[]; }
function setProgress(a){ wr(K.progress, a); }
function masteryBase(){ return rd(K.mastery, {}); }

/* 把基准里的相对天数换算成真实日期 */
function baseDateOf(cid, p){
  if(p.baseOff==null) return null;
  return dstr(shift(p.baseOff));
}

/* 推导每个知识点的当前状态 */
function deriveStates(cid){
  var c = courseOf(cid), mb = masteryBase()[cid]||{}, out = {};
  var i, p, b, st;
  for(i=0;i<c.points.length;i++){
    p = c.points[i];
    b = mb[p.id] || {state:p.base, at:baseDateOf(cid,p)};
    out[p.id] = {state:b.state||'unlearned', at:b.at||null, touched:b.at||null, idx:i};
  }
  var recs = progress().slice().sort(function(a,b){ return a.date<b.date?-1:1; });
  for(i=0;i<recs.length;i++){
    var r = recs[i];
    if(!out[r.pid]) continue;
    st = out[r.pid];
    if(r.type==='done'){ st.state='verified'; st.at=r.date; st.touched=r.date; }
    else if(r.type==='started'){
      if(st.state==='unlearned') st.state='unverified';
      if(!st.touched || r.date>st.touched) st.touched=r.date;
      st.startedDate = r.date;
    }
  }
  // 衰退：已验证掌握且超过 DECAY_DAYS 天没有再验证
  for(var k in out){
    st = out[k];
    if(st.state==='verified' && st.at){
      var gap = daysBetween(st.at, todayKey());
      if(gap >= DECAY_DAYS){ st.state='decayed'; st.gap=gap; }
    }
  }
  return out;
}

/* 未完成顺延：有 started 记录、且之后没有 done 记录的知识点 */
function carryOver(cid){
  var recs = progress(), byPoint = {}, i, r;
  for(i=0;i<recs.length;i++){
    r = recs[i];
    if(!pointOf(cid, r.pid)) continue;
    if(!byPoint[r.pid]) byPoint[r.pid] = {started:null, done:null};
    if(r.type==='started'){ if(!byPoint[r.pid].started || r.date>byPoint[r.pid].started) byPoint[r.pid].started=r.date; }
    if(r.type==='done'){ if(!byPoint[r.pid].done || r.date>byPoint[r.pid].done) byPoint[r.pid].done=r.date; }
  }
  var out=[];
  for(var pid in byPoint){
    var v=byPoint[pid];
    if(v.started && (!v.done || v.done < v.started)){
      out.push({pid:pid, date:v.started});
    }
  }
  out.sort(function(a,b){ return a.date<b.date?-1:1; });
  return out;
}

var TIER = {carry:0, decayed:1, unverified:2, unlearned:3};
var TIER_TXT = {carry:'未完成顺延', decayed:'已衰退待复习', unverified:'学过未验证', unlearned:'还没学'};

/* 构造候选队列（排序即优先级：顺延 > 已衰退 > 未验证 > 未学） */
function buildQueue(cid){
  var st = deriveStates(cid), co = carryOver(cid), i, list=[], coMap={};
  for(i=0;i<co.length;i++) coMap[co[i].pid]=co[i].date;
  var c = courseOf(cid);
  for(i=0;i<c.points.length;i++){
    var p = c.points[i], s = st[p.id];
    if(s.state==='verified') continue;               // 已验证掌握且未衰退：不重复学
    var tier = coMap[p.id]!=null ? 0 : TIER[s.state];
    list.push({
      pid:p.id, name:p.name, ch:p.ch, state:s.state, tier:tier,
      at:s.at, touched:s.touched, startedDate:coMap[p.id]||null, idx:i,
      gap:(s.state==='decayed' && s.at)? daysBetween(s.at, todayKey()) : 0
    });
  }
  list.sort(function(a,b){
    if(a.tier!==b.tier) return a.tier-b.tier;
    if(a.tier===0) return a.startedDate<b.startedDate?-1:1;      // 越早卡住的越先补
    if(a.tier===1) return b.gap-a.gap;                            // 越久没复习的越先复习
    if(a.tier===2) return (a.touched||'0')<(b.touched||'0')?-1:1; // 越久没碰的越先验证
    return a.idx-b.idx;                                           // 未学按章节顺序
  });
  return list;
}

/* 今日方案 */
function buildPlan(cid){
  var q = buildQueue(cid);
  if(!q.length) return {empty:true, queue:[]};
  var top = q[0];
  var pf = profile()||{};
  var dur = 10;
  var reasons = [];
  if(top.tier===0){
    reasons.push('因为你'+relDay(top.startedDate)+'开始了「'+top.name+'」但没有提交产出，今天把它提前了');
  }else if(top.tier===1){
    reasons.push('「'+top.name+'」已衰退（距上次验证 '+top.gap+' 天），按"衰退 > 未验证 > 未学"排在最前');
  }else if(top.tier===2){
    reasons.push('「'+top.name+'」学过但没有产出能证明，今天用它换一个可验证的产出');
  }else{
    reasons.push('「'+top.name+'」按章节顺序是下一个未学知识点');
  }
  if(pf.daysLeft!=null && pf.daysLeft<=7){
    reasons.push('距考试还有 '+pf.daysLeft+' 天，队列里今天只做这一个，做完整理进复习队列');
  }
  return {
    date: todayKey(), cid: cid, top: top, queue: q,
    duration: dur, output: outputForm(pointOf(cid, top.pid), top.idx),
    reasons: reasons, progIds: progress().map(function(r){return r.id;})
  };
}

    }
    lines.push(why);
  }
  if(!lines.length) lines.push('与上一份方案相比，队首没有变化：还是「'+plan.top.name+'」。');
  return {first:false, changed:changed||removed.length>0, lines:lines, prev:prev};
}

/* ==========================================================================
   本地检索：BM25 + 中文 bigram（零依赖）
   ========================================================================== */
function bigrams(s){
  var t = String(s||'').toLowerCase().replace(/[\s，。、；：？！（）()【】\[\]"'“”‘’·]/g,'');
  var out=[]; for(var i=0;i<t.length-1;i++) out.push(t.substr(i,2));
  if(t.length===1) out.push(t);
  return out;
}
function kbOf(cid){ var all=rd(K.kb,{}); return all[cid]||[]; }
function kbSet(cid, arr){ var all=rd(K.kb,{}); all[cid]=arr; wr(K.kb, all); }
function searchKB(cid, query, topN){
  var docs = kbOf(cid);
  if(!docs.length) return [];
  var q = bigrams(query), n = docs.length, df={}, i, j;
  var dterms=[];
  for(i=0;i<n;i++){
    var bg = bigrams(docs[i].title+' '+docs[i].text);
    dterms.push(bg);
    var seen={};
    for(j=0;j<bg.length;j++){ if(!seen[bg[j]]){ seen[bg[j]]=1; df[bg[j]]=(df[bg[j]]||0)+1; } }
  }
  var k1=1.5, b=0.75, scores=[];
  var avgdl = dterms.reduce(function(a,x){return a+x.length;},0)/n;
  for(i=0;i<n;i++){
    var tf={}, dl=dterms[i].length;
    for(j=0;j<dterms[i].length;j++) tf[dterms[i][j]]=(tf[dterms[i][j]]||0)+1;
    var s=0, seenq={};
    for(j=0;j<q.length;j++){
      var term=q[j];
      if(seenq[term]) continue; seenq[term]=1;
      var f=tf[term]||0; if(!f) continue;
      var idf = Math.log(1 + (n - (df[term]||0) + 0.5)/((df[term]||0) + 0.5));
      s += idf * (f*(k1+1)) / (f + k1*(1 - b + b*dl/avgdl));
    }
    if(s>0) scores.push({doc:docs[i], score:s});
  }
  scores.sort(function(a,b){ return b.score-a.score; });
  return scores.slice(0, topN||3);
}
/* 按段落分片（300–600 字，重叠 50 字） */
function splitText(text, title){
  var raw = String(text||'').replace(/\r/g,'');
  var paras = raw.split(/\n{1,}/).map(function(x){return x.trim();}).filter(function(x){return x.length>0;});
  var merged=[], buf='';
  paras.forEach(function(p){
    if((buf+p).length<=600){ buf += (buf?' ':'') + p; }
    else { if(buf) merged.push(buf); buf=p; }
  });
  if(buf) merged.push(buf);
  var out=[], i;
  for(i=0;i<merged.length;i++){
    var seg = merged[i];
    if(seg.length>600){
      var step=550, s=0;
      while(s<seg.length){ out.push(seg.substr(s, 600)); s += step; }
    } else out.push(seg);
  }
  // 合并过短片段
  var fin=[], acc='';
  for(i=0;i<out.length;i++){
    acc += (acc?' ':'') + out[i];
    if(acc.length>=300){ fin.push(acc); acc=''; }
  }
  if(acc) { if(fin.length) fin[fin.length-1] += ' '+acc; else fin.push(acc); }
  return fin.map(function(t,i){ return {id:'u'+(Date.now()%100000)+'_'+i, title:(title||'粘贴资料')+' · 片段'+(i+1), text:t}; });
}

  else toast('完整版在仓库里（Python 后端 + 向量检索），本端口是它删掉服务端后的比赛版。');

function callLLM(prompt, maxTokens){
  var c = cfg();
  var url = c.base_url.replace(/\/+$/,'') + '/chat/completions';
  return fetch(url, {
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+c.api_key},
    body: JSON.stringify({model:c.model, messages:[{role:'user', content:prompt}], temperature:0.3, max_tokens:maxTokens||800, stream:false})
  }).catch(function(e){
    throw new Error('连不上这个端点（'+(e && e.message ? e.message : e)+'）。多数 OpenAI 兼容端点没有开放浏览器跨域（CORS）：请在 base_url 里填你自己的代理地址。本应用不内置任何服务端代理，代理的可用性与责任归属由使用者自行承担。');
  }).then(function(r){
    if(!r.ok){
      return r.text().then(function(t){
        var m=''; try{ var j=JSON.parse(t); m=(j.error&&(j.error.message||j.error.code))||t; }catch(e){ m=t; }
        if(r.status===401) throw new Error('Key 无效或未授权（401）。请检查 api_key。');
        if(r.status===402) throw new Error('余额不足（402）。请充值或换一个端点。');
        if(r.status===404) throw new Error('端点路径找不到（404）。base_url 通常要写到 /v1。');
        if(r.status===429) throw new Error('被限流了（429）。稍后再试或换模型。');
        throw new Error('请求失败 '+r.status+'：'+String(m).slice(0,200));
      });
    }
    return r.json();
  }).then(function(j){
    var txt = j && j.choices && j.choices[0] && (j.choices[0].message && j.choices[0].message.content || j.choices[0].text);
    if(!txt) throw new Error('端点返回了空内容。可能是模型名不对，或该端点不兼容 OpenAI 格式。');
    return txt;
  });
}

function syncPlan(plan, diff){
  var hist = planHist(), last = hist.length?hist[hist.length-1]:null;
  var curIds={}; plan.progIds.forEach(function(i){curIds[i]=1;});
  var removed = last? (last.progIds||[]).filter(function(i){return !curIds[i];}) : [];
  var needPush = !last || last.date!==plan.date || last.topPid!==plan.top.pid || removed.length>0;
  if(needPush){ savePlan(plan, diff); }
  else{
    last.topPid=plan.top.pid; last.topName=plan.top.name; last.topTier=plan.top.tier;
    last.queue=plan.queue.slice(0,5).map(function(x){return {pid:x.pid,name:x.name,tier:x.tier,state:x.state};});
    last.reasons=diff.lines; last.progIds=plan.progIds;
    last.records=progress().map(function(r){return {id:r.id,pid:r.pid,type:r.type,date:r.date};});
    wr(K.planHist, hist);
  }
}

  var total = EXEC.dur*60;
  var shown = Math.min(EXEC.elapsed, total);

  var mm = Math.floor(shown/60), ss = shown%60;

  var h='<h1 class="t" style="margin-top:14px">'+esc(p.name)+'</h1>';

    '<div class="timer">'+pad(mm)+':'+pad(ss)+'</div>'+

    '<p class="small" style="margin-top:10px">'+(EXEC.running?'进行中 · 计时可中断，中断不惩罚':'还没开始')+
      (EXEC.accel?' · 演示加速已开启（'+EXEC.dur+' 分钟压缩为 '+EXEC.dur+' 秒）':'')+'</p>'+
    (isDemo()? '<div class="spread gap"><button class="btn sm ghost" data-act="toggleAccel">'+(EXEC.accel?'关掉演示加速':'开启演示加速')+'</button>'+

  '</div>';

  h += '<div class="card">'+
    '<div class="field"><label class="lab">先写一句承诺：这 '+EXEC.dur+' 分钟我要产出什么</label>'+
      '<textarea class="inp" id="e_promise" style="min-height:80px" placeholder="例如：我要讲清楚中值定理的两个条件，和结论里那个「至少存在一点」">'+esc(EXEC.promise||'')+'</textarea></div>'+

function tickExec(){
  if(!EXEC || !EXEC.running) return;
  var real = (Date.now()-EXEC.t0)/1000;
  EXEC.elapsed = Math.floor(real * (EXEC.accel?60:1));
  var total = EXEC.dur*60;
  if(EXEC.elapsed>=total && !EXEC.ended){ EXEC.ended=true; EXEC.running=false; }
  var el = document.querySelector('.timer');
  if(el){
    var shown=Math.min(EXEC.elapsed,total), mm=Math.floor(shown/60), ss=shown%60;
    el.innerHTML = pad(mm)+':'+pad(ss);
    var bar=document.querySelector('.tbar i'); if(bar) bar.style.width = Math.min(100,Math.round(shown/total*100))+'%';
  }
  if(EXEC.ended){ render(); }
}
setInterval(tickExec, 250);

ACTS.tglTimer = function(){
  if(!EXEC) return;
  if(EXEC.running){ EXEC.running=false; EXEC.elapsed = Math.floor((Date.now()-EXEC.t0)/1000*(EXEC.accel?60:1)); render(); return; }
  EXEC.promise = (document.getElementById('e_promise')||{}).value||'';
  EXEC.running=true; EXEC.t0 = Date.now() - (EXEC.elapsed/(EXEC.accel?60:1))*1000;
  // 开始计时 = 在本机留一条 started 记录，未完成则次日自动顺延
  var recs = progress();
  var exists = recs.some(function(r){ return r.pid===EXEC.pid && r.type==='started' && r.date===todayKey(); });
  if(!exists){ recs.push({id:'s'+Date.now(), pid:EXEC.pid, type:'started', date:todayKey()}); setProgress(recs); }
  logEv('timer_start', {pid:EXEC.pid});
  render();
};

ACTS.mic = function(){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    toast('本浏览器不支持语音识别（Web Speech API），已切换为文字输入。文字输入完全等价。');
    var t=document.getElementById('s_text'); if(t) t.focus();
    return;
  }
  var rec = new SR();
  rec.lang='zh-CN'; rec.interimResults=true; rec.continuous=true;
  var t = document.getElementById('s_text');
  var start = t.value? (t.value+'\n') : '';
  rec.onresult = function(ev){
    var s='';
    for(var i=ev.resultIndex;i<ev.results.length;i++) s += ev.results[i][0].transcript;
    t.value = start + s;
    var cnt=document.getElementById('s_cnt'); if(cnt) cnt.textContent=t.value.trim().length;
  };
  rec.onerror = function(ev){
    if(ev.error==='not-allowed') toast('麦克风权限被拒绝了，已切回文字输入。文字输入完全等价。');
    else toast('语音识别出错：'+ev.error+'。已切回文字输入。');
  };
  try{ rec.start(); toast('开始听。说完点一下页面上任意位置结束，或直接编辑文字。'); }
  catch(e){ toast('无法启动录音，已切回文字输入。'); }
};

    '{"right":["讲对了的关键内容"],"missed":[{"t":"漏掉了什么","q":"对应的原文原句"}],"wrong":["讲错了什么"],"verdict":"过或不过","tag":"概念没分清/步骤跳太快/用记忆代替理解/没讲全/讲偏了 五选一"}\n'+
    '语气红线：只能用描述性的"你漏掉了 X"，绝对不能出现"你讲得不好""你的理解有误""你不懂"这类评价学生本人的话。';
  box.innerHTML = '<div class="badge-row" style="margin-top:12px"><span class="badge warn">这段内容将被发送给你配置的端点</span></div>'+
    '<div class="small" style="margin-top:8px">正在请求 '+esc(cfg().base_url)+' …</div>';
  callLLM(prompt, 1200).then(function(raw){
    var j=null;
    try{ var m=raw.match(/\{[\s\S]*\}/); j=JSON.parse(m?m[0]:raw); }catch(e){ throw new Error('模型返回的不是可解析的 JSON，无法给出判定。请重试或换一个模型。'); }
    var res = {right:j.right||[], missed:j.missed||[], wrong:j.wrong||[], verdict:(j.verdict==='过'?'过':'不过'), tag:j.tag||'没讲全'};
    TONE_RED.forEach(function(w){ if(raw.indexOf(w)>=0){ throw new Error('模型输出命中了语气红线词，已丢弃该结果，不展示。请重试。'); } });
    box.innerHTML = renderTri(res, docs.length>0, short)+'<div class="card" style="margin-top:10px"><div class="badge-row">'+aiBadge()+'</div>'+
      '<div class="spread gap"><button class="btn sm ghost" data-act="go" data-arg="today">记下，回今日一课</button>'+
      '<button class="btn sm ghost" data-act="go" data-arg="ask">这一点我没懂</button></div></div>';
    applyVerdict(cid, pid, res.verdict);
    var sp = rd(K.speak, []); sp.push({pid:pid, date:todayKey(), text:txt.slice(0,400), verdict:res.verdict, tag:res.tag, grounded:docs.length>0}); wr(K.speak, sp);
  }).catch(function(err){
    box.innerHTML = errBox(err.message||String(err), ['重试一次','检查配置','切回演示模式']);
  });
}
function applyVerdict(cid, pid, verdict){
  var mb = masteryBase(); mb[cid]=mb[cid]||{};
  mb[cid][pid] = {state: verdict==='过'?'verified':'unverified', at: todayKey()};
  wr(K.mastery, mb);
}

var QZ = null;
SCREENS.quiz = function(p){
  var cid = p.cid || (profile()&&profile().courseId) || 'math';
  var c = courseOf(cid);
  if(!c.quiz.length){
    return '<h1 class="t" style="margin-top:14px">这门课没有内置题库</h1>'+
      '<p class="st">自定义课程的题要自己攒。可以先去粘贴课件，或直接开始今日一课。</p>'+
      '<button class="btn gap" data-act="go" data-arg="today">直接开始今日一课</button>';
  }
  if(!QZ || QZ.cid!==cid){ QZ = {cid:cid, i:0, answers:[], done:false}; }
  var q = c.quiz[QZ.i];
  var h='<div class="badge-row" style="margin-top:14px">'+(isDemo()?demoBadge():'')+'<span class="badge local">第 '+(QZ.i+1)+' / '+c.quiz.length+' 题</span><span class="badge local">难度 '+esc(q.d)+'</span></div>';
  h += '<div class="card"><div class="qn">'+esc(q.q)+'</div>'+
    '<div class="small" style="margin-top:6px">绑定知识点：'+esc((pointOf(cid,q.pid)||{}).name||q.pid)+'</div>'+
    '<div style="margin-top:12px" id="q_opts">'+q.o.map(function(x,i){
      return '<button class="opt" data-act="answer" data-arg="'+i+'"><span class="ok">'+'ABCD'[i]+'</span><span>'+esc(x)+'</span></button>';
    }).join('')+'</div>'+
    '<div id="q_exp"></div></div>';
  h += '<div class="card"><div class="small">答对直接标"已验证掌握"，不重复学；答错归入"学过未验证"，会排在队列前面。中途退出可续做（进度写在本机）。</div>'+
    '<button class="btn sm ghost gap" data-act="quizSkip">先跳过这套题</button></div>';
  return h;
};
ACTS.answer = function(a){
  var cid = QZ.cid, c = courseOf(cid), q = c.quiz[QZ.i];
  var pick = parseInt(a,10), ok = pick===q.a;
  var box = document.getElementById('q_opts');
  var bs = box.querySelectorAll('button');
  for(var i=0;i<bs.length;i++){
    bs[i].disabled=true;
    if(i===q.a) bs[i].className='opt correct';
    else if(i===pick) bs[i].className='opt wrong';
  }
  document.getElementById('q_exp').innerHTML =
    '<div class="exp"><b>'+(ok?'答对了':'这一题的答案是 '+'ABCD'[q.a])+'</b><br>'+esc(q.e)+'</div>'+
    '<button class="btn gap" data-act="nextQ">'+(QZ.i+1>=c.quiz.length?'看诊断结果':'下一题')+'</button>';
  // 立即更新掌握度：答对 → 已验证掌握；答错 → 学过未验证
  var mb = masteryBase(); mb[cid]=mb[cid]||{};
  mb[cid][q.pid] = {state: ok?'verified':'unverified', at: todayKey()};
  wr(K.mastery, mb);
  QZ.answers.push({pid:q.pid, ok:ok});
};
ACTS.nextQ = function(){
  var c = courseOf(QZ.cid);
  QZ.i++;
  if(QZ.i>=c.quiz.length){
    var n = QZ.answers.filter(function(x){return x.ok;}).length;
    QZ=null;
    toast('诊断完成：'+n+' / '+c.quiz.length+' 答对。答对的已标为"已验证掌握"，不重复学。', 3400);
    go('today', {}, 'home');
    return;
  }
  render();
};
ACTS.quizSkip = function(){ QZ=null; go('today', {}, 'home'); };

ACTS.exportAll = function(){
  var data = {

    profile:rd(K.profile,null), progress:rd(K.progress,[]), mastery:rd(K.mastery,{}),
    planHistory:rd(K.planHist,[]), kb:rd(K.kb,{}), speak:rd(K.speak,[])

};
ACTS.importAll = function(){
  var inp = document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
  inp.onchange = function(){
    var f = inp.files[0]; if(!f) return;
    var fr = new FileReader();
    fr.onload = function(){
      try{
        var d = JSON.parse(fr.result);
        if(!d || d.v!==1) throw new Error('版本不匹配');
        wr(K.profile, d.profile||null); wr(K.progress, d.progress||[]); wr(K.mastery, d.mastery||{});
        wr(K.planHist, d.planHistory||[]); wr(K.kb, d.kb||{}); wr(K.speak, d.speak||[]);
        toast('导入成功。'); go('today');
      }catch(e){
        toast('档案版本不匹配或文件损坏，已保留你现有的数据，未做任何覆盖。');
      }
    };
    fr.readAsText(f);   // 全程在浏览器内存里完成，不产生任何网络请求
  };
  inp.click();
};
